<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerca Piatti da Cucinare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #27ae60;
            --accent: #2ecc71;
            --dark: #2d3436;
            --light: #f9f9f9;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0f2f5;
            margin: 0; padding: 40px 20px;
        }

        .container { max-width: 900px; margin: auto; }

        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { color: var(--dark); font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { color: #636e72; font-size: 1.1rem; }

        .search-box { 
            background: white; padding: 10px; border-radius: 16px;
            display: flex; gap: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        input { flex: 1; padding: 15px 20px; border: none; font-size: 16px; outline: none; }
        button { 
            padding: 15px 30px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #219150; }

        #results { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; margin-top: 40px; 
        }

        .card { 
            background: white; border-radius: 20px; padding: 15px;
            transition: 0.3s; border: 1px solid #eee;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; }
        .card h3 { font-size: 1.1rem; margin: 15px 0; color: var(--dark); }
        
        .btn-recipe { 
            display: block; text-align: center; padding: 12px; 
            background: var(--dark); color: white; border-radius: 10px; 
            text-decoration: none; font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero">
            <h1>🍏 Il tuo cerca piatti</h1>
            <p>Non sai cosa cucinare? Cerca qui!</p>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Esempio: uova, farina, pomodoro...">
            <button onclick="searchFood()">Cerca</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        async function searchFood() {
            const results = document.getElementById('results');
            const query = document.getElementById('searchInput').value;
            if(!query) return;

            results.innerHTML = '<p style="text-align:center; width:100%">Cucino nuove idee per te...</p>';
            
            try {
                // Cambia questa riga nel tuo <script>:
                const res = await fetch(`/api/search?query=${query}`);
                const data = await res.json();
                results.innerHTML = '';
                
                data.forEach(r => {
                    results.innerHTML += `
                        <div class="card">
                            <img src="${r.image}" alt="${r.title}">
                            <h3>${r.title}</h3>
                            <a href="${r.source_url}" target="_blank" class="btn-recipe">Apri Ricetta</a>
                        </div>
                    `;
                });
            } catch(e) {
                results.innerHTML = '<p style="text-align:center">Ops! Il server sta dormendo, riprova tra un attimo.</p>';
            }
        }
    </script>
</body>
</html>
