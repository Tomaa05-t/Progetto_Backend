<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Finder Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #27ae60;
            --dark: #2d3436;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0f2f5;
            margin: 0; padding: 40px 20px;
        }

        .container { max-width: 900px; margin: auto; }
        .hero { text-align: center; margin-bottom: 40px; }
        
        .search-box { 
            background: white; padding: 10px; border-radius: 16px;
            display: flex; gap: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        input { flex: 1; padding: 15px 20px; border: none; font-size: 16px; outline: none; }
        button { 
            padding: 15px 30px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #219150; }

        #results { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; margin-top: 40px; 
        }

        .card { background: white; border-radius: 20px; padding: 15px; border: 1px solid #eee; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; }
        .card h3 { font-size: 1.1rem; margin: 15px 0; color: var(--dark); }
        .btn-recipe { 
            width: 100%; padding: 12px; background: var(--dark); color: white; 
            border: none; border-radius: 10px; cursor: pointer; font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero">
            <h1>🍏 Food Finder Pro</h1>
            <p>Trova nuove idee per i tuoi ingredienti!</p>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Esempio: uova, farina, pomodoro...">
            <button onclick="searchFood()">Cerca</button>
        </div>
        
        <div id="results"></div>
    </div>

    <div id="recipeModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:20px; width:80%; max-width:600px; max-height:80vh; overflow-y:auto; position:relative;">
            <button onclick="closeModal()" style="position:absolute; top:10px; right:10px; border:none; background:none; cursor:pointer; font-size:20px;">✖</button>
            <div id="modalContent">Caricamento...</div>
        </div>
    </div>

    <script>
        async function searchFood() {
            const results = document.getElementById('results');
            const query = document.getElementById('searchInput').value;
            if(!query) return;

            results.innerHTML = '<p style="text-align:center">Cucino nuove idee per te...</p>';
            
            try {
                const res = await fetch(`https://progetto-backend-iqr5.onrender.com/api/search?query=${query}`);
                const data = await res.json();
                results.innerHTML = '';
                
                data.forEach(r => {
                    results.innerHTML += `
                        <div class="card">
                            <img src="${r.image}" alt="${r.title}">
                            <h3>${r.title}</h3>
                            <button onclick="openRecipe(${r.id})" class="btn-recipe">Vedi Procedimento</button>
                        </div>
                    `;
                });
            } catch(e) {
                results.innerHTML = '<p style="text-align:center">Ops! Server non raggiungibile.</p>';
            }
        }

        async function openRecipe(id) {
            const modal = document.getElementById('recipeModal');
            const content = document.getElementById('modalContent');
            modal.style.display = 'flex';
            content.innerHTML = 'Caricamento istruzioni...';

            try {
                const res = await fetch(`https://progetto-backend-iqr5.onrender.com/api/recipe/${id}/instructions`);
                const data = await res.json();
                
                let html = '<h2>Procedimento</h2>';
                if (data.length > 0 && data[0].steps) {
                    data[0].steps.forEach(step => {
                        html += `<p><strong>Passo ${step.number}:</strong> ${step.step}</p>`;
                    });
                } else {
                    html = '<p>Nessuna istruzione trovata.</p>';
                }
                content.innerHTML = html;
            } catch(e) {
                content.innerHTML = '<p>Errore nel caricamento.</p>';
            }
        }

        function closeModal() {
            document.getElementById('recipeModal').style.display = 'none';
        }
    </script>
</body>
</html>
